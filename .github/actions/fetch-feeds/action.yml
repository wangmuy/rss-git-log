name: 'Fetch RSS Feeds'
description: 'Fetch RSS feeds and commit unread logs to a GitHub data branch. Requires dependencies installed (npm ci) and rss-config.json in working directory before invoking.'

inputs:
  branch:
    description: 'Data branch to read config from and write logs to'
    required: true
    default: 'rss-reader-data'
  proxy_mode:
    description: 'CORS proxy mode (direct-only, proxy-fallback, proxy-only)'
    required: true
    default: 'proxy-fallback'
  proxy_templates:
    description: 'CORS proxy templates (name|urlTemplate, one per line)'
    required: true
    default: |
      corsproxy.io|https://corsproxy.io/?{url}
      allorigins.win|https://api.allorigins.win/raw?url={url}
  timeout_ms:
    description: 'Per-feed timeout in milliseconds'
    required: true
    default: '10000'
  pool_size:
    description: 'Concurrent feed fetch limit'
    required: true
    default: '5'
  target_token:
    description: 'GitHub PAT (leave empty to use GITHUB_TOKEN)'
    required: false
    default: ''
  target_owner:
    description: 'Target repo owner (leave empty for current repo)'
    required: false
    default: ''
  target_repo:
    description: 'Target repo name (leave empty for current repo)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - run: npx tsx -r tsconfig-paths/register ${{ github.action_path }}/../../scripts/fetch-feeds.ts
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.target_token || github.token }}
        TARGET_OWNER: ${{ inputs.target_owner || github.repository_owner }}
        TARGET_REPO: ${{ inputs.target_repo || github.event.repository.name }}
        TARGET_BRANCH: ${{ inputs.branch }}
        PROXY_MODE: ${{ inputs.proxy_mode }}
        PROXY_TEMPLATES: ${{ inputs.proxy_templates }}
        TIMEOUT_MS: ${{ inputs.timeout_ms }}
        POOL_SIZE: ${{ inputs.pool_size }}
